include "backend.conf"

appName = preferences

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.preferences.module.PreferencesModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"

play.http.filters = "uk.gov.hmrc.preferences.filters.PreferencesFilter"

# Session Timeout
# ~~~~
# The default session timeout for the app is 15 minutes (900seconds).
# Updating this is the responsibility of the app - it must issue a new cookie with each request or the session will
# timeout 15 minutes after login (regardless of user activity).
# session.maxAge=900

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
# If you deploy your application to several instances be sure to use the same key!
# Per the PR bot, this is already provided by bootstrap
#play.http.secret.key = "8NfbrpLFBJz8FoD4OoozuzwmUr4jLzofCY8LsnKBL6B6TdrBzaiOb7yliEfW2NL4"

# Base 64 encoded MD5 hash of application.secret
# Previous keys provided here are needed by integration tests:
cookie.encryption {
  # Per the PR bot, this is already provided by bootstrap
  #key="gvBoGdgzqG1AarzF1LY0zQ=="
  previousKeys=["AwMDAwMDAwMDAwMDAwMDAw==","BAQEBAQEBAQEBAQEBAQEBA=="]
}

# For local development
queryParameter.encryption.key="gvBoGdgzqG1AarzF1LY0zQ=="

# Session configuration
# ~~~~~
application.session.httpOnly = false

application.session.secure = false

emailVerificationLink.timeout = 7 days

verification.timeoutInDays = 7

# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Global object class
# ~~~~~
# Define the Global object class for this application.
# Default to Global in the root package.
#application.global = uk.gov.hmrc.preferences.MicroserviceGlobal

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
play.http.router = prod.Routes

activation.gracePeriodInMin=2880

# preferences with major < reopin.major trigger re-optin
reoptin.major = 1

etmpUpdate.switchOn = false

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging enabled
# The below controllers are the default exceptions to this rule.

controllers {

  confidenceLevel = 50
  needsAuditing = false

  uk.gov.hmrc.play.health.AdminController = {
    needsAuth = false
    needsLogging = false
  }

  com.kenshoo.play.metrics.MetricsController = {
    needsAuth = false
    needsLogging = false
  }

  uk.gov.hmrc.preferences.controllers {
    EmailVerificationController.needsAuth = false

    PreferencesController.needsAuth = false

    TermsAndConditionsController.needsAuth = false

    testonly.AdminController.needsAuth = false

    stats.StatsController.needsAuth = false
  }
}


# Evolutions
# ~~~~~
# You can disable evolutions if needed
# evolutionplugin=disabled

# Logger
# ~~~~~
# You can also configure logback (http://logback.qos.ch/), by providing a logger.xml file in the conf directory .

# Root logger:
#logger.root = ERROR

# Logger used by the framework:
#logger.play = WARN

# Logger provided to your application:
#logger.application = INFO

mongodb {
  uri = "mongodb://localhost:27017/preferences"
}

taxPlatformSaPrefsRootUri = "http://localhost:9024"

bounceQueue {
  batchSize = 100
  forceLockReleaseAfter = 30 minutes
}

verificationReminders {
  sendRemindersAfter = 1 millisecond
  anotherReminderAfter = 5 days
  retryFailedAfter = 1 millisecond
}

microservice {
  metrics {
    gauges {
      interval = 15 minutes
    }
  }

  services {
    timeout = 5 seconds

    delay-response = 2 seconds

    protocol = http

    auth {
      host = localhost
      port = 8500
    }

    email {
      host = localhost
      port = 8300
    }

    entity-resolver {
      host = localhost
      port = 8015
    }

    secure-message {
      host = localhost
      port = 9051
    }

    taxpayer-data {
      host = localhost
      port = 8091
    }

    taxpayer-data-hip {
      host = localhost
      port = 8091
      client-id = "some client-id"
      client-secret = "some client-secret"
      enabled = false
    }

    citizen-details {
      host = localhost
      port = 9337
    }

    channel-preferences {
      host = localhost
      port = 9052
    }

    preferences-changed-notifier {
      host = localhost
      port = 8027
    }
  }
}

scheduling {
  sendVerificationReminders {
    taskEnabled = false
    initialDelay = 15 minutes
    interval = 5 minutes
    activePeriod {
      start = "08:00"
      stop = "23:00"
    }
  }
  
  preferencesCountReset {
    taskEnabled = false
    initialDelay = 1 day
    interval = 1 day
  }
  
  cleanupUnverifiedJob {
    startHourOfDay = 15
    interval = 2 minutes
    initialDelay = 1 minute
    dryRun = false
    taskEnabled = false
    batchSize = 5000
    expireUnverified = 7 days
    activePeriod {
      start: "09:00"
      stop: "22:00"
    }
  }

  cleanUpForNoEnrolments {
    startHourOfDay = 15
    interval = 2 minutes
    initialDelay = 1 minute
    taskEnabled = false
    batchSize = 5000
    expireAfter = 28 days
    activePeriod {
      start = "08:00"
      stop = "23:00"
    }
  }
}

business-account.host="http://localhost:9020"
personal-account.host="http://localhost:9232"